<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitala – offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5f0;
        --surface: #ffffff;
        --text: #1e241f;
        --muted: #5a625b;
        --border: #e0dcd2;
        --primary: #2f6f4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171a;
          --surface: #1c2126;
          --text: #e9ecea;
          --muted: #a7b0aa;
          --border: #2e353b;
          --primary: #5fb98a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 28rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerade offline</h1>
      <p>
        Vitala ist im Moment nicht erreichbar. Deine bereits geladenen Inhalte bleiben verfügbar,
        sobald du wieder online bist.
      </p>
      <a href="/">Erneut versuchen</a>
    </main>
  </body>
</html>
