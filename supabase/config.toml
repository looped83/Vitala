# Supabase local configuration for Vitala.
# See docs/database-and-migrations.md. Ports are local defaults; adjust only if
# they clash with another project.
project_id = "vitala"

[api]
enabled = true
port = 54321
# Only the public schema is exposed via PostgREST. The private `app` schema
# (RLS helper functions) is intentionally NOT exposed to clients.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Private, invite-based product: public self-signup is disabled. New members
# join via the invite RPC. See docs/authentication.md (ADR-0011).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
